name: Validate PulSe
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version-pinned GHCR Compose
        env:
          PULSE_TEST_USER: ci
          PULSE_TEST_PASSWORD: ci-validation-password
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          test "$(docker compose --env-file .env.example config --images)" = "ghcr.io/mick7784/links-pulse:1.1.4"
          PULSE_VERSION=latest docker compose --env-file .env.example config --images | grep -Fx "ghcr.io/mick7784/links-pulse:latest"
      - name: Release immutability and latest regression guards
        run: python3 tests/release-guard.py
      - name: Unit and server tests
        run: node --test tests/*.test.mjs
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pulse-browser" playwright@1.62.1
          "$RUNNER_TEMP/pulse-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mobile, desktop, media and PWA browser regression
        env:
          NODE_PATH: ${{ runner.temp }}/pulse-browser/node_modules
          PULSE_SCREENSHOT_DIR: ${{ runner.temp }}/pulse-screenshots
        run: node tests/browser.cjs
      - name: Check out the reviewed LinKs engine
        uses: actions/checkout@v4
        with:
          repository: Mick7784/LinKs
          ref: af97374d6776367931c263932b89291a758924cb
          path: links-engine
          persist-credentials: false
      - name: Real LinKs and PulSe mobile integration
        env:
          NODE_PATH: ${{ runner.temp }}/pulse-browser/node_modules
          LINKS_REPO: ${{ github.workspace }}/links-engine
          PYTHON_PATH: ${{ runner.temp }}/links-python/bin/python
          PULSE_SCREENSHOT_DIR: ${{ runner.temp }}/pulse-screenshots
        run: |
          python3 -m venv "$RUNNER_TEMP/links-python"
          "$PYTHON_PATH" -m pip install Pillow
          node tests/links-integration.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-browser-fixtures
          path: ${{ runner.temp }}/pulse-screenshots
          if-no-files-found: ignore
      - name: Build Docker and verify isolated container
        run: |
          set -euo pipefail
          docker build -t pulse-validation .
          docker run -d --name pulse-validation --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:14173:4173 -e PULSE_TEST_USER=test -e PULSE_TEST_PASSWORD=local-validation-password pulse-validation
          trap 'docker logs pulse-validation; docker rm -f pulse-validation' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:14173/healthz; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14173/)" = 401
          curl -fsS -u test:local-validation-password http://127.0.0.1:14173/ -o /dev/null
          curl -fsS -u test:local-validation-password http://127.0.0.1:14173/pwa.mjs -o /dev/null
          curl -fsS -u test:local-validation-password http://127.0.0.1:14173/api/stats | node -e "let s='';process.stdin.on('data',b=>s+=b);process.stdin.on('end',()=>{if(JSON.parse(s).available!==false)process.exit(1)})"

      - name: Private boundary through real Traefik and internal bridge
        run: node tests/edge-integration.mjs

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable version, verify architectures, then promote latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh
