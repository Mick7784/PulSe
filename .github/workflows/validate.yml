name: Validate PulSe
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit and server tests
        run: node --test tests/*.test.mjs
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pulse-browser" playwright@1.62.1
          "$RUNNER_TEMP/pulse-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mobile, desktop, media and PWA browser regression
        env:
          NODE_PATH: ${{ runner.temp }}/pulse-browser/node_modules
          PULSE_SCREENSHOT_DIR: ${{ runner.temp }}/pulse-screenshots
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-browser-fixtures
          path: ${{ runner.temp }}/pulse-screenshots
          if-no-files-found: ignore
      - name: Build Docker and verify isolated container
        run: |
          set -euo pipefail
          docker build -t pulse-validation .
          docker run -d --name pulse-validation --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:14173:4173 -e PULSE_TEST_USER=test -e PULSE_TEST_PASSWORD=local-validation-password pulse-validation
          trap 'docker logs pulse-validation; docker rm -f pulse-validation' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:14173/healthz; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14173/)" = 401
          curl -fsS -u test:local-validation-password http://127.0.0.1:14173/ -o /dev/null
          curl -fsS -u test:local-validation-password http://127.0.0.1:14173/pwa.mjs -o /dev/null
          curl -fsS -u test:local-validation-password http://127.0.0.1:14173/api/stats | node -e "let s='';process.stdin.on('data',b=>s+=b);process.stdin.on('end',()=>{if(JSON.parse(s).available!==false)process.exit(1)})"

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version v$version is already released; leaving immutable image/tag unchanged."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-architecture Docker image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mick7784/links-pulse:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Mick7784/PulSe
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Create GitHub release and version tag
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PulSe V${{ steps.release.outputs.version }}" \
            --notes-file docs/RELEASE_NOTES.md
