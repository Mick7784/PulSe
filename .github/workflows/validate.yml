name: Validate PulSe
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier version/latest après preuve d’isolation et accord opérateur'
        type: boolean
        default: false
      isolation_evidence:
        description: 'URL du bilan approuvé : refus public, droits, révocation, HTTPS, auto-update désactivé'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pulse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version-pinned GHCR Compose
        env:
          PULSE_PRIVATE_NETWORK: fixture-private
          LINKS_BRIDGE_NETWORK: fixture-bridge
          PULSE_BRIDGE_TOKEN: fixture-bridge-token-at-least-32-characters
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          test "$(docker compose --env-file .env.example config --images)" = "ghcr.io/mick7784/links-pulse:1.1.5"
          PULSE_VERSION=latest docker compose --env-file .env.example config --images | grep -Fx "ghcr.io/mick7784/links-pulse:latest"
      - name: Release immutability and latest regression guards
        run: python3 tests/release-guard.py
      - name: Unit and server tests
        run: node --test tests/*.test.mjs
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pulse-browser" playwright@1.62.1
          "$RUNNER_TEMP/pulse-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mobile, desktop, media and PWA browser regression
        env:
          NODE_PATH: ${{ runner.temp }}/pulse-browser/node_modules
          PULSE_SCREENSHOT_DIR: ${{ runner.temp }}/pulse-screenshots
        run: node tests/browser.cjs
      - name: Read the immutable LinKs release lock
        id: links
        run: node -e "const fs=require('fs'),r=require('./tests/links-release.json');if(!/^[a-f0-9]{40}$/.test(r.revision))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,'revision='+r.revision+'\n')"
      - name: Check out only the released LinKs fixture helper
        uses: actions/checkout@v4
        with:
          repository: Mick7784/LinKs
          ref: ${{ steps.links.outputs.revision }}
          path: links-engine
          persist-credentials: false
      - name: Real released LinKs image, PulSe, SQLite and mobile integration
        env:
          NODE_PATH: ${{ runner.temp }}/pulse-browser/node_modules
          LINKS_REPO: ${{ github.workspace }}/links-engine
          LINKS_CONTAINER: '1'
          PULSE_SCREENSHOT_DIR: ${{ runner.temp }}/pulse-screenshots
        run: node tests/links-integration.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-browser-fixtures
          path: ${{ runner.temp }}/pulse-screenshots
          if-no-files-found: ignore
      - name: Build Docker and verify isolated container
        run: |
          set -euo pipefail
          docker build -t pulse-validation .
          docker run -d --name pulse-validation --read-only --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:14173:4173 pulse-validation
          trap 'docker logs pulse-validation; docker rm -f pulse-validation' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:14173/healthz; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14173/)" = 200
          curl -fsS http://127.0.0.1:14173/ -o /dev/null
          curl -fsS http://127.0.0.1:14173/pwa.mjs -o /dev/null
          curl -fsS http://127.0.0.1:14173/api/stats | node -e "let s='';process.stdin.on('data',b=>s+=b);process.stdin.on('end',()=>{if(JSON.parse(s).available!==false)process.exit(1)})"

      - name: Private boundary through real Traefik and internal bridge
        run: node tests/edge-integration.mjs

  publish:
    needs: validate
    environment: pulse-private-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.isolation_evidence != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record operator isolation approval (no deployment)
        env:
          ISOLATION_EVIDENCE: ${{ inputs.isolation_evidence }}
        run: |
          node -e "const u=new URL(process.env.ISOLATION_EVIDENCE);if(u.protocol!=='https:')process.exit(1)"
          printf 'Isolation review: %s\n' "$ISOLATION_EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable version, verify architectures, then promote latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh
