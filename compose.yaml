name: links-pulse-test
services:
  pulse:
    image: ghcr.io/mick7784/links-pulse:${PULSE_VERSION:-1.1.4}
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    environment:
      PULSE_TEST_USER: ${PULSE_TEST_USER:?Identifiant PulSe requis}
      PULSE_TEST_PASSWORD: ${PULSE_TEST_PASSWORD:?Mot de passe PulSe requis}
      PULSE_BRIDGE_TOKEN: ${PULSE_BRIDGE_TOKEN:-}
      LINKS_PUBLIC_URL: ${LINKS_PUBLIC_URL:-http://domotik-links:8080}
      LINKS_BRIDGE_URL: ${LINKS_BRIDGE_URL:-}
    ports:
      - "127.0.0.1:${PULSE_LOCAL_PORT:-4173}:4173"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      pangolin_proxy:
        aliases: [pulse-story-spike-test]
networks:
  pangolin_proxy:
    external: true
    name: ${PANGOLIN_PROXY_NETWORK:?Réseau Pangolin existant requis}
